plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'drpijon'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'drpijon.Main'
}

tasks.named('shadowJar') {
    archiveBaseName.set('drpijon')
    archiveVersion.set('')
    archiveClassifier.set('')
}
